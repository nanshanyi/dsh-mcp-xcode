# dsh-mcp-xcode bundle patch
#
# 当本包通过官方命令安装后,dsh 启动时自动加载此 patch:
#
#   dsh plugin --profile <name> add "github:nanshanyi/dsh-mcp-xcode#v1.0.0"
#
# 叠加顺序:dsh-base → dsh-web-app → 本 bundle patch → profile cordis.patch.yml → --patch
# 无需手动编辑 profile 的 cordis.patch.yml。

- insert:
    - id: mcp-xcode
      name: 'dsh-mcp-xcode'
      # 可选配置:
      # config:
      #   clientName: deepseek-harness   # 显示在 Xcode 授权弹窗里的客户端名
      #   bridgePath: /usr/bin/xcrun
      #   bridgeArgs: ['mcpbridge']
      #   includeTools: ['BuildProject', 'XcodeList*']   # 只注册匹配的工具(支持 * ? 通配)
      #   excludeTools: ['StringCatalog*']               # 排除匹配的工具
